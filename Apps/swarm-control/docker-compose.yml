name: swarm-control

services:
  # ─── SwarmClaw — AI agent runtime ───
  swarmclaw:
    container_name: SwarmClaw
    image: ghcr.io/swarmclawai/swarmclaw:latest
    ports:
      - "3456:3456"
      - "3457:3457"
    environment:
      ACCESS_KEY: '${SWARMCLAW_API_KEY:-auto}'
      SWARMCLAW_LOG_LEVEL: '${SWARMCLAW_LOG_LEVEL:-info}'
      SWARMCLAW_EXTENSION_FAILURE_THRESHOLD: '${SWARMCLAW_EXTENSION_FAILURE_THRESHOLD:-3}'
      OLLAMA_BASE_URL: '${OLLAMA_BASE_URL:-http://ollama:11434}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
    volumes:
      - /DATA/AppData/swarm-control/swarmclaw-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3456/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - FOWNER
    networks:
      - swarm-control-net

  # ─── Ollama — local LLM provider sidecar ───
  ollama:
    container_name: SwarmControlOllama
    image: ollama/ollama:0.23.4
    environment:
      OLLAMA_KEEP_ALIVE: '${OLLAMA_KEEP_ALIVE:-5m}'
      OLLAMA_NUM_PARALLEL: '${OLLAMA_NUM_PARALLEL:-1}'
      OLLAMA_MAX_LOADED_MODELS: '${OLLAMA_MAX_LOADED_MODELS:-1}'
    volumes:
      - /DATA/AppData/swarm-control/ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - swarm-control-net
    deploy:
      resources:
        limits:
          memory: 16G
        # Uncomment below for NVIDIA GPU acceleration (RTX A2000, etc.):
        # reservations:
        #   devices:
        #     - capabilities: [gpu]
    x-casaos:
      envs:
        - container: OLLAMA_KEEP_ALIVE
          description:
            en_us: 'How long Ollama keeps loaded models in memory (e.g., 5m, 1h, -1 for forever)'
          default: 5m
        - container: OLLAMA_NUM_PARALLEL
          description:
            en_us: 'Number of parallel requests Ollama processes simultaneously'
          default: '1'
        - container: OLLAMA_MAX_LOADED_MODELS
          description:
            en_us: 'Maximum number of models Ollama keeps loaded at once'
          default: '1'
      volumes:
        - container: /root/.ollama
          description:
            en_us: Ollama model storage and configuration

  # ─── Gateway Bridge — exposes SwarmClaw agents as an OpenClaw gateway ───
  gateway-bridge:
    container_name: SwarmControlBridge
    image: ghcr.io/a730/swarm-control-bridge:v1.0.0
    ports:
      - "18789:18789"
    environment:
      SWARMCLAW_API_URL: 'http://swarmclaw:3456'
      SWARMCLAW_API_KEY: '${SWARMCLAW_API_KEY:-auto}'
      GATEWAY_BRIDGE_PORT: '18789'
      AGENT_SYNC_INTERVAL_MS: '${AGENT_SYNC_INTERVAL_MS:-5000}'
      MISSION_CONTROL_URL: 'http://swarmcontrol:3000'
      MISSION_CONTROL_API_KEY: '${MC_API_KEY:-}'
    depends_on:
      swarmclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/18789"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - FOWNER
    networks:
      - swarm-control-net

  # ─── Mission Control — agent orchestration dashboard ───
  swarmcontrol:
    container_name: swarmcontrol
    image: ghcr.io/builderz-labs/mission-control:latest
    ports:
      - "3000:3000"
    environment:
      PORT: '3000'
      TZ: '${TZ:-UTC}'
      OPENCLAW_GATEWAY_HOST: 'gateway-bridge'
      OPENCLAW_GATEWAY_PORT: '18789'
      MC_DEFAULT_GATEWAY_NAME: 'swarmclaw-bridge'
      MC_COORDINATOR_AGENT: '${MC_COORDINATOR_AGENT:-coordinator}'
      AUTH_USER: '${MC_AUTH_USER:-admin}'
      NEXT_PUBLIC_GATEWAY_URL: 'ws://localhost:18789'
      NEXT_PUBLIC_GATEWAY_OPTIONAL: 'true'
      MC_ENABLE_HSTS: '${MC_ENABLE_HSTS:-true}'         # enable HSTS for security scan
      MC_ALLOWED_HOSTS: '${MC_ALLOWED_HOSTS:-localhost,127.0.0.1}'
      MC_COOKIE_SECURE: '${MC_COOKIE_SECURE:-true}'     # HTTPS-only cookies
      MC_COOKIE_SAMESITE: '${MC_COOKIE_SAMESITE:-strict}' # strict SameSite
      MC_CLAUDE_HOME: '${MC_CLAUDE_HOME:-}'
      OPENCLAW_HOME: '${OPENCLAW_HOME:-/app/.data/.openclaw}'  # runtime install path
      MC_RETAIN_ACTIVITIES_DAYS: '${MC_RETAIN_ACTIVITIES_DAYS:-90}'
      MC_RETAIN_AUDIT_DAYS: '${MC_RETAIN_AUDIT_DAYS:-365}'
      MC_RETAIN_LOGS_DAYS: '${MC_RETAIN_LOGS_DAYS:-30}'
      MC_RETAIN_NOTIFICATIONS_DAYS: '${MC_RETAIN_NOTIFICATIONS_DAYS:-60}'
      MC_RETAIN_TOKEN_USAGE_DAYS: '${MC_RETAIN_TOKEN_USAGE_DAYS:-90}'
    depends_on:
      gateway-bridge:
        condition: service_healthy
    labels:
      - "casaos.port=3000"
      - "casaos.protocol=http"
      - "casaos.entrypoint=/"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - /DATA/AppData/swarm-control/mc-data:/app/.data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - FOWNER
    networks:
      - swarm-control-net
    x-casaos:
      envs:
        # ── LLM Provider API Keys ──
        - container: OPENAI_API_KEY
          description:
            en_us: 'OpenAI API key for using GPT models in SwarmClaw agents (leave empty if using Ollama)'
          default: ''
        - container: ANTHROPIC_API_KEY
          description:
            en_us: 'Anthropic API key for using Claude models in SwarmClaw agents (leave empty if using Ollama)'
          default: ''
        # ── Ollama (Local LLM) ──
        - container: OLLAMA_ENABLED
          description:
            en_us: 'Set to false to disable the bundled Ollama sidecar'
          default: 'true'
        - container: OLLAMA_BASE_URL
          description:
            en_us: 'URL for Ollama API (change if using an external Ollama instance)'
          default: http://ollama:11434
        - container: OLLAMA_DEFAULT_MODEL
          description:
            en_us: 'Default model to pull on first Ollama startup (e.g., llama3.2:latest, mistral, qwen2.5)'
          default: llama3.2:latest
        # ── SwarmClaw Runtime ──
        - container: SWARMCLAW_API_KEY
          description:
            en_us: 'API key for SwarmClaw agent runtime authentication. Auto-generated if left empty.'
          default: auto
        - container: SWARMCLAW_LOG_LEVEL
          description:
            en_us: 'SwarmClaw log verbosity (debug/info/warn/error)'
          default: info
        - container: SWARMCLAW_EXTENSION_FAILURE_THRESHOLD
          description:
            en_us: 'Number of consecutive failures before an external extension is auto-disabled'
          default: '3'
        # ── Gateway Bridge ──
        - container: AGENT_SYNC_INTERVAL_MS
          description:
            en_us: 'How often (in ms) the bridge polls SwarmClaw and syncs agents to Mission Control'
          default: '5000'
        # ── Mission Control Auth ──
        - container: MC_AUTH_USER
          description:
            en_us: 'Mission Control admin username'
          default: admin
        - container: MC_AUTH_PASS
          description:
            en_us: 'Mission Control admin password. Leave empty for auto-generated secure password (check container logs).'
          default: ''
        - container: MC_API_KEY
          description:
            en_us: 'API key for Mission Control programmatic access. Leave empty for auto-generated secure key.'
          default: ''
        # ── Mission Control Security ──
        - container: MC_ENABLE_HSTS
          description:
            en_us: 'Enable HSTS header for HTTPS enforcement (recommended: true)'
          default: 'true'
        - container: MC_ALLOWED_HOSTS
          description:
            en_us: 'Comma-separated host allowlist (default: localhost,127.0.0.1). Add your Tailscale IP or domain.'
          default: localhost,127.0.0.1
        - container: MC_COOKIE_SECURE
          description:
            en_us: 'Enforce HTTPS-only session cookies (recommended: true)'
          default: 'true'
        - container: MC_COOKIE_SAMESITE
          description:
            en_us: 'SameSite cookie policy (strict/lax/none)'
          default: strict
        - container: MC_COORDINATOR_AGENT
          description:
            en_us: 'Name of the default orchestrator/coordinator agent'
          default: coordinator
        # ── Mission Control Advanced ──
        - container: MC_CLAUDE_HOME
          description:
            en_us: 'Path to Claude Code config directory for session tracking integration'
          default: ''
        - container: OPENCLAW_HOME
          description:
            en_us: 'Path to OpenClaw state directory (needed for runtime installation, memory browser, log viewer)'
          default: /app/.data/.openclaw
        # ── Data Retention ──
        - container: MC_RETAIN_ACTIVITIES_DAYS
          description:
            en_us: 'Days to retain activity feed entries (0 = forever)'
          default: '90'
        - container: MC_RETAIN_AUDIT_DAYS
          description:
            en_us: 'Days to retain audit log events (0 = forever)'
          default: '365'
        - container: MC_RETAIN_LOGS_DAYS
          description:
            en_us: 'Days to retain OpenClaw agent logs (0 = forever)'
          default: '30'
        - container: MC_RETAIN_NOTIFICATIONS_DAYS
          description:
            en_us: 'Days to retain user notifications (0 = forever)'
          default: '60'
        - container: MC_RETAIN_TOKEN_USAGE_DAYS
          description:
            en_us: 'Days to retain token usage records (0 = forever)'
          default: '90'
        # ── General ──
        - container: TZ
          description:
            en_us: 'Timezone for all services (e.g., America/New_York, Europe/London)'
          default: UTC
      volumes:
        - container: /app/.data
          description:
            en_us: Mission Control SQLite database and application data
        - container: /DATA/AppData/swarm-control/swarmclaw-data
          description:
            en_us: SwarmClaw agent data, memory, and configuration

networks:
  swarm-control-net:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: swarmcontrol
  description:
    en_us: 'Unified AI agent swarm orchestration platform. Combines SwarmClaw agent runtime with Ollama (local LLM), Gateway Bridge, and Mission Control dashboard. Run autonomous AI agent swarms with delegation, memory, MCP tools, and real-time monitoring — out of the box with local LLM support.'
  tagline:
    en_us: Autonomous AI agent swarm orchestration with local LLM
  developer: SwarmClaw AI + Builderz Labs
  author: a730
  icon: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/swarm-control/logo.png
  thumbnail: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/swarm-control/thumbnail.png
  title:
    en_us: SwarmControl
  category: Agent Platforms
  port_map: "3000"
  scheme: http
  index: /setup
  tips:
    before_install:
      en_us: |
        SwarmControl bundles SwarmClaw (agent runtime), Ollama (local LLM sidecar),
        Mission Control (orchestration dashboard), and Gateway Bridge.

        FIRST STARTUP:
        1. Open http://localhost:3456 (SwarmClaw)
        2. Complete the setup wizard — Ollama is pre-configured as a local provider
        3. Create a CEO/orchestrator agent (the "boss" agent of your swarm)
        4. Open http://localhost:3000/setup (Mission Control)
        5. Create your admin account
        6. The CEO agent will automatically appear in Mission Control's dashboard

        NOTE: Mission Control shows an empty dashboard until you create at least
        one agent in SwarmClaw. This is expected — no agents exist yet.

        AUTO-GENERATED CREDENTIALS:
        MC_AUTH_PASS and MC_API_KEY are not set by default. Mission Control
        auto-generates secure random values on first launch and prints them
        to container logs. Check with: docker logs swarmcontrol
        To set custom credentials, fill in MC_AUTH_PASS and MC_API_KEY
        in the CasaOS app settings before starting.

        SECURITY SCORE:
        The bundled Mission Control is pre-configured for a ~95+ security audit
        score: HSTS enabled, secure cookies, strict SameSite, host filtering,
        auto-generated credentials (not weak defaults), and data retention
        policies set.

        OLLAMA SIDECAR:
        - Runs internally (no host port exposure needed)
        - Pull models via: docker exec SwarmControlOllama ollama pull <model>
        - For NVIDIA GPU acceleration (RTX A2000, etc.), uncomment the
          deploy.resources.reservations.devices section in the Ollama service
          of the docker-compose.yml file
        - Disable by setting OLLAMA_ENABLED=false in CasaOS env settings

        LLM PROVIDERS:
        - Ollama (local): bundled sidecar, use immediately, no API key needed
        - OpenAI: set OPENAI_API_KEY in env vars
        - Anthropic: set ANTHROPIC_API_KEY in env vars

        PULLING A MODEL:
        After installation, to pull your first Ollama model:
          docker exec SwarmControlOllama ollama pull llama3.2:latest
