name: qdrant
services:
  qdrant:
    container_name: Qdrant
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: '6333'
      QDRANT__SERVICE__GRPC_PORT: '6334'
      QDRANT__SERVICE__API_KEY: '${QDRANT_API_KEY:-}'
      QDRANT__LOG_LEVEL: '${LOG_LEVEL:-INFO}'
      QDRANT__TELEMETRY_DISABLED: 'true'
    volumes:
      - /DATA/AppData/qdrant/storage:/qdrant/storage
      - /DATA/AppData/qdrant/snapshots:/qdrant/snapshots
    labels:
      - "casaos.port=6333"
      - "casaos.protocol=http"
      - "casaos.entrypoint=/dashboard"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    x-casaos:
      envs:
        - container: QDRANT_API_KEY
          description:
            en_us: 'API key for securing Qdrant access (optional, leave empty for no auth)'
          default: ''
        - container: LOG_LEVEL
          description:
            en_us: 'Log level (INFO, DEBUG, WARN, ERROR)'
          default: INFO
      volumes:
        - container: /qdrant/storage
          description:
            en_us: Qdrant vector database storage
        - container: /qdrant/snapshots
          description:
            en_us: Qdrant snapshots directory
x-casaos:
  architectures:
    - amd64
    - arm64
  main: qdrant
  description:
    en_us: 'Qdrant is a high-performance vector similarity search engine and vector database written in Rust. Provides REST and gRPC APIs for storing, searching, and managing high-dimensional vectors with additional payload data. Ideal for AI embeddings, semantic search, and RAG applications.'
  tagline:
    en_us: High-performance vector database for AI
  developer: Qdrant
  author: a730
  icon: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/qdrant/logo.png
  thumbnail: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/qdrant/thumbnail.png
  title:
    en_us: Qdrant
  category: AI Serving
  port_map: "6333"
  scheme: http
  index: /dashboard
  screenshots: []
  tips:
    before_install:
      en_us: |
        Qdrant is a vector similarity search engine. It exposes:
          - REST API: port 6333
          - gRPC API: port 6334
          - Web UI: http://localhost:6333/dashboard
        Optionally set QDRANT_API_KEY to secure access.
        Data is persisted in /DATA/AppData/qdrant/.
