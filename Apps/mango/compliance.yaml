app:
  name: Mango
  version: latest
  description: Mango is a self-hosted manga server and web reader with built-in
    anime streaming and manga search. Supports local CBZ/ZIP/CBR libraries,
    OPDS, multi-user, and online content browsing from ComicK, MangaDex,
    AnimeKai and more.
data_stored:
  - type: user_content
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: configuration
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
network_egress:
  telemetry: false
  update_checks: true
  external_api_calls: []
  urls:
    - github.com
    - ghcr.io
    - docker.io
authentication:
  local_accounts: false
  sso: false
  mfa: false
  session_type: token
hardening:
  container_user: app
  read_only_fs: false
  network_policy: bridge
  exposed_ports:
    - "9000"
compliance:
  gdpr_compatible: true
  data_sovereignty: local
  backup_strategy: manual
  audit_logging: false
  encryption_options:
    - tls
