app:
  name: SwarmClaw
  version: latest
  description: Open-source self-hosted AI agent runtime and multi-agent framework.
    Run autonomous AI agents, agent swarms, and orchestrators with memory, MCP
    tools, skills, delegation, schedules, and 23+ LLM providers (Claude, GPT,
    Gemini, OpenRouter, Ollama). A practical Claude Code and LangChain
    alternative.
data_stored:
  - type: credentials
    location: environment_variables
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: user_content
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: configuration
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
network_egress:
  telemetry: false
  update_checks: true
  external_api_calls: []
  urls:
    - github.com
    - ghcr.io
    - docker.io
authentication:
  local_accounts: false
  sso: false
  mfa: false
  session_type: token
hardening:
  container_user: app
  read_only_fs: false
  network_policy: bridge
  exposed_ports:
    - "3456"
    - "3457"
compliance:
  gdpr_compatible: true
  data_sovereignty: local
  backup_strategy: manual
  audit_logging: false
  encryption_options:
    - tls
