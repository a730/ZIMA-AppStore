app:
  name: SGLang (AVX2 CPU)
  version: v0.5.11
  description: SGLang is a high-performance serving framework for LLMs. This build is compiled from source with -march=znver2 (AVX2) optimization for AMD Zen2 CPUs.
data_stored:
  - type: user_content
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: configuration
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
network_egress:
  telemetry: false
  update_checks: true
  external_api_calls: []
  urls:
    - github.com
    - ghcr.io
    - docker.io
    - huggingface.co
authentication:
  local_accounts: false
  sso: false
  mfa: false
  session_type: token
hardening:
  container_user: root
  read_only_fs: false
  network_policy: bridge
  exposed_ports:
    - "8004"
compliance:
  gdpr_compatible: true
  data_sovereignty: local
  backup_strategy: manual
  audit_logging: false
  encryption_options:
    - tls
