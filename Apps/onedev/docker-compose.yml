name: onedev
services:
  onedev:
    container_name: onedev
    image: 1dev/onedev
    ports:
      - "6610:6610"
    labels:
      - "casaos.port=6610"
      - "casaos.protocol=http"
      - "casaos.entrypoint=/"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6610/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - /DATA/AppData/onedev/data:/opt/onedev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    x-casaos:
      volumes:
        - container: /opt/onedev
          description:
            en_us: OneDev data (repositories, CI/CD configs, issues)
x-casaos:
  architectures:
    - amd64
  main: onedev
  description:
    en_us: OneDev is a lightweight and powerful all-in-one DevOps platform.
  tagline:
    en_us: All-in-one DevOps platform
  developer: onedev
  author: Zima
  icon: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/onedev/logo.png
  thumbnail: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/onedev/thumbnail.png
  title:
    en_us: OneDev
  category: Development
  port_map: "6610"
  scheme: http
  index: /
  screenshots:
    - https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/onedev/screenshot-1.png
