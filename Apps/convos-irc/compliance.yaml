app:
  name: Convos IRC
  version: stable
  description: Multi-user IRC web client with always-on bouncer for AI agents

data_stored:
  - type: user_content
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: credentials
    location: local_filesystem
    encryption: at_rest
    retention: until_uninstall
    user_deletable: true
  - type: configuration
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true

network_egress:
  telemetry: false
  update_checks: false
  external_api_calls: []
  urls:
    - github.com
    - ghcr.io

authentication:
  local_accounts: true
  sso: false
  mfa: false
  session_type: token

hardening:
  container_user: convos
  read_only_fs: false
  network_policy: bridge
  exposed_ports:
    - 3000

compliance:
  gdpr_compatible: true
  data_sovereignty: local
  backup_strategy: manual
  audit_logging: false
  encryption_options:
    - tls
