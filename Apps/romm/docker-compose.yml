name: romm
services:
  romm:
    container_name: romm
    image: rommapp/romm:latest
    ports:
      - "8083:8080"
    labels:
      - "casaos.port=8083"
      - "casaos.protocol=http"
      - "casaos.entrypoint=/"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
      cache:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - FOWNER
    networks:
      - romm-net
    x-casaos:
      volumes: []
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: romm
    networks:
      - romm-net
    x-casaos:
      volumes: []
  cache:
    image: valkey/valkey:8.1.7
    restart: unless-stopped
    networks:
      - romm-net
    x-casaos:
      volumes: []

networks:
  romm-net:
    driver: bridge

x-casaos:
  architectures:
    - amd64
  main: romm
  description:
    en_us: RomM is a self-hosted ROM manager for game enthusiasts.
  tagline:
    en_us: Beautiful ROM manager
  developer: romm
  author: Zima
  icon: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/romm/logo.png
  thumbnail: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/romm/logo.png
  title:
    en_us: RomM
  category: Games
  port_map: "8083"
  scheme: http
  index: /
  screenshots:
    - https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/romm/screenshot-1.png
