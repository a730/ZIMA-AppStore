name: llm-scaler
services:
  llm-scaler:
    container_name: llm-scaler
    image: intel/llm-scaler-vllm:0.14.0-b8.2.1
    ports:
      - "8001:8001"
    labels:
      - "casaos.port=8001"
      - "casaos.protocol=http"
      - "casaos.entrypoint=/"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              driver: xpu
              count: -1
    restart: unless-stopped
    x-casaos:
      volumes: []
x-casaos:
  architectures:
    - amd64
  main: llm-scaler
  description:
    en_us: LLM Scaler optimized for Intel Arc GPUs for efficient LLM inference.
  tagline:
    en_us: Intel Arc optimized LLM scaling
  developer: intel
  author: Zima
  icon: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/llm-scaler/logo.png
  thumbnail: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/llm-scaler/logo.png
  title:
    en_us: LLM Scaler
  category: Generative AI
  port_map: "8001"
  scheme: http
  index: /
  screenshots:
    - https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/llm-scaler/screenshot-1.png
