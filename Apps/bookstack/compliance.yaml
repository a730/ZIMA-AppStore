app:
  name: BookStack
  version: latest
  description: BookStack is a free and open-source wiki designed for creating
    beautiful documentation. Featuring a simple but powerful WYSIWYG editor, it
    allows teams to create detailed and useful documentation with ease. Powered
    by MariaDB.
data_stored:
  - type: user_content
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: configuration
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
network_egress:
  telemetry: false
  update_checks: true
  external_api_calls: []
  urls:
    - github.com
    - docker.io
    - lscr.io
authentication:
  local_accounts: false
  sso: false
  mfa: false
  session_type: token
hardening:
  container_user: app
  read_only_fs: false
  network_policy: bridge
  exposed_ports:
    - "6875"
compliance:
  gdpr_compatible: true
  data_sovereignty: local
  backup_strategy: manual
  audit_logging: false
  encryption_options:
    - tls
