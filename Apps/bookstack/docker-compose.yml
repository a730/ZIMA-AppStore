name: bookstack
services:
  bookstack:
    container_name: BookStack
    image: lscr.io/linuxserver/bookstack:latest
    ports:
      - "6875:80"
    environment:
      PUID: '1000'
      PGID: '1000'
      APP_URL: 'http://localhost:6875'
      DB_HOST: 'bookstack-db'
      DB_PORT: '3306'
      DB_USER: 'bookstack'
      DB_PASS: '${DB_PASS:-bookstack}'
      DB_DATABASE: 'bookstack'
    volumes:
      - /DATA/AppData/bookstack/config:/config
    labels:
      - "casaos.port=6875"
      - "casaos.protocol=http"
      - "casaos.entrypoint=/"
    depends_on:
      bookstack-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    x-casaos:
      envs:
        - container: DB_PASS
          description:
            en_us: 'MariaDB password for BookStack database user'
          default: bookstack
      volumes:
        - container: /config
          description:
            en_us: BookStack configuration and uploads
  bookstack-db:
    container_name: BookStackDB
    image: lscr.io/linuxserver/mariadb:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASS:-bookstack}'
      MYSQL_DATABASE: 'bookstack'
      MYSQL_USER: 'bookstack'
      MYSQL_PASSWORD: '${DB_PASS:-bookstack}'
    volumes:
      - /DATA/AppData/bookstack/db:/config
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASS:-bookstack}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    x-casaos:
      envs:
        - container: DB_ROOT_PASS
          description:
            en_us: 'MariaDB root password'
          default: bookstack
      volumes:
        - container: /config
          description:
            en_us: MariaDB data directory
x-casaos:
  architectures:
    - amd64
    - arm64
  main: bookstack
  description:
    en_us: 'BookStack is a free and open-source wiki designed for creating beautiful documentation. Featuring a simple but powerful WYSIWYG editor, it allows teams to create detailed and useful documentation with ease. Powered by MariaDB.'
  tagline:
    en_us: Self-hosted documentation wiki
  developer: BookStackApp
  author: a730
  icon: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/bookstack/logo.png
  thumbnail: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/bookstack/thumbnail.png
  title:
    en_us: BookStack
  category: Productivity
  port_map: "6875"
  scheme: http
  index: /
  tips:
    before_install:
      en_us: |
        Default login: admin@admin.com / password
        BookStack runs on port 6875 behind the scenes via a MariaDB database.
        After installation, open http://localhost:6875 and log in with the default credentials.
        Change the password immediately after first login.
