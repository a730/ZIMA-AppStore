app:
  name: CNCjs
  version: latest
  description: CNCjs is a web-based interface for CNC milling controller running
    Grbl, Smoothieware, or TinyG. Connecting to the CNC machine over a serial
    connection using a USB serial port or a Serial-to-WiFi module like XBee or
    USR-WIFI232-T.
data_stored:
  - type: user_content
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: configuration
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
network_egress:
  telemetry: false
  update_checks: true
  external_api_calls: []
  urls:
    - github.com
    - docker.io
authentication:
  local_accounts: false
  sso: false
  mfa: false
  session_type: token
hardening:
  container_user: app
  read_only_fs: false
  network_policy: bridge
  exposed_ports:
    - "8005"
compliance:
  gdpr_compatible: true
  data_sovereignty: local
  backup_strategy: manual
  audit_logging: false
  encryption_options:
    - tls
