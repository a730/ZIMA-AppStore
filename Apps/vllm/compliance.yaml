app:
  name: vLLM (AVX2 + OpenVINO)
  version: latest
  description: vLLM is a high-throughput and memory-efficient serving engine for
    LLMs. This build is compiled from source with AVX2 and OpenVINO support,
    optimized for AMD Ryzen Threadripper 3970X and similar Zen2/AVX2 CPUs.
data_stored:
  - type: user_content
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: configuration
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
network_egress:
  telemetry: false
  update_checks: true
  external_api_calls: []
  urls:
    - github.com
    - ghcr.io
    - docker.io
authentication:
  local_accounts: false
  sso: false
  mfa: false
  session_type: token
hardening:
  container_user: app
  read_only_fs: false
  network_policy: bridge
  exposed_ports:
    - "8003"
compliance:
  gdpr_compatible: true
  data_sovereignty: local
  backup_strategy: manual
  audit_logging: false
  encryption_options:
    - tls
