name: vllm
services:
  vllm:
    container_name: vllm
    image: ghcr.io/a730/vllm-cpu:latest
    ports:
      - "8003:8000"
    labels:
      - "casaos.port=8003"
      - "casaos.protocol=http"
      - "casaos.entrypoint=/v1/completions"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      VLLM_OPENVINO_DEVICE: CPU
      VLLM_CPU_KVCACHE_SPACE: "40"
      VLLM_CPU_AVX2: "1"
      VLLM_CPU_OMP_THREADS_BIND: close
      VLLM_OPENVINO_ENABLE_QUANTIZED_WEIGHTS: "1"
    volumes:
      - /DATA/AppData/vllm/models:/root/.cache/huggingface
      - /DATA/AppData/vllm/config:/app/config
    deploy:
      resources:
        limits:
          memory: 64G
          cpus: "32"
        reservations:
          memory: 16G
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    x-casaos:
      envs:
        - container: VLLM_OPENVINO_DEVICE
          description:
            en_us: OpenVINO device (CPU, GPU, NPU)
        - container: VLLM_CPU_KVCACHE_SPACE
          description:
            en_us: KV cache size in GB (adjust based on your RAM)
        - container: VLLM_CPU_OMP_THREADS_BIND
          description:
            en_us: CPU thread binding strategy (close/spread)
        - container: VLLM_OPENVINO_ENABLE_QUANTIZED_WEIGHTS
          description:
            en_us: U8 weight compression at load time (1=ON, 0=OFF)
          default: "1"
      volumes:
        - container: /root/.cache/huggingface
          description:
            en_us: HuggingFace model cache directory
        - container: /app/config
          description:
            en_us: vLLM configuration files
x-casaos:
  architectures:
    - amd64
  main: vllm
  description:
    en_us: vLLM v0.19.0 + OpenVINO plugin (patched). Serves Gemma 4, Qwen3 MoE, gpt-oss, and standard LLMs on AVX2 CPUs with on-the-fly INT4 quantization.
  tagline:
    en_us: High-throughput LLM serving (v0.19 + OpenVINO)
  developer: vllm-project
  author: ZIMA
  icon: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/vllm/logo.png
  thumbnail: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/vllm/thumbnail.png
  title:
    en_us: vLLM (v0.19 + OpenVINO)
  category: Generative AI
  port_map: "8003"
  scheme: http
  index: /
  screenshots:
    - https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/vllm/screenshot-1.png
  tips:
    before_install:
      en_us: |
        vLLM v0.19.0 with OpenVINO plugin (patched).
        Supports Gemma 4, Qwen3 MoE, gpt-oss, and standard LLMs.
        INT4 quantization on first use via optimum-intel.
        Recommended launch arguments:
          --model <model-name> --max-model-len 8192 --dtype float32 --cpu-offload-gb 8
        Models are cached in /DATA/AppData/vllm/models after first download.
