app:
  name: ZeroDotEmail
  version: latest
  description: An open-source AI email client that integrates with Gmail and other services.
data_stored:
  - type: credentials
    location: environment_variables
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: user_content
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: configuration
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: api_credentials
    location: environment_variables
    encryption: at_rest
    retention: until_uninstall
    user_deletable: true
network_egress:
  telemetry: false
  update_checks: true
  external_api_calls:
    - url: https://api.openai.com
      purpose: LLM API calls
      auth: api_key
    - url: https://api.anthropic.com
      purpose: LLM API calls
      auth: api_key
  urls:
    - github.com
    - docker.io
authentication:
  local_accounts: true
  sso: false
  mfa: false
  session_type: token
  api_key_supported: true
hardening:
  container_user: app
  read_only_fs: false
  network_policy: bridge
  exposed_ports:
    - "8079"
compliance:
  gdpr_compatible: true
  data_sovereignty: local
  backup_strategy: manual
  audit_logging: false
  encryption_options:
    - tls
