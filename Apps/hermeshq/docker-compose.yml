version: "3.7"
name: hermeshq
services:
  backend:
    container_name: hermeshq-backend
    image: jpalmae/hermeshq-backend:latest
    restart: unless-stopped
    volumes:
      - /DATA/AppData/hermeshq/backend:/app/data
    x-casaos:
      volumes:
        - container: /app/data
          description:
            en_us: Backend data storage

  frontend:
    container_name: hermeshq-frontend
    image: jpalmae/hermeshq-frontend:latest
    ports:
      - "3420:80"
    labels:
      - "casaos.port=3420"
      - "casaos.protocol=http"
      - "casaos.entrypoint=/"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    network_mode: bridge
    restart: unless-stopped
    x-casaos:
      volumes: []

  postgres:
    container_name: hermeshq-db
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - /DATA/AppData/hermeshq/db:/var/lib/postgresql/data
    x-casaos:
      volumes:
        - container: /var/lib/postgresql/data
          description:
            en_us: Postgres database storage

x-casaos:
  architectures:
    - amd64
  main: frontend
  description:
    en_us: HermesHQ is a specialized AI management platform.
  tagline:
    en_us: AI management platform
  developer: jpalmae
  author: Zima
  icon: https://raw.githubusercontent.com/justserdar/ZimaOS-AppStore/main/Apps/hermeshq/logo.png
  thumbnail: https://raw.githubusercontent.com/justserdar/ZimaOS-AppStore/main/Apps/hermeshq/logo.png
  title:
    en_us: HermesHQ
  category: Generative AI
  port_map: "3420"
  scheme: http
  index: /
