app:
  name: HermesHQ
  version: latest
  description: HermesHQ is a Docker-first control plane for running and operating
    multiple Hermes Agent instances from one web application. Features include
    web UI, RBAC, task dispatch, schedules, inter-agent communication, and
    enterprise MCP access.
data_stored:
  - type: credentials
    location: environment_variables
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: user_content
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: configuration
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
network_egress:
  telemetry: false
  update_checks: true
  external_api_calls: []
  urls:
    - github.com
    - ghcr.io
    - docker.io
authentication:
  local_accounts: true
  sso: false
  mfa: false
  session_type: token
  api_key_supported: true
hardening:
  container_user: app
  read_only_fs: false
  network_policy: bridge
  exposed_ports:
    - "8006"
    - "3420"
compliance:
  gdpr_compatible: true
  data_sovereignty: local
  backup_strategy: manual
  audit_logging: false
  encryption_options:
    - tls
