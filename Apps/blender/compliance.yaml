app:
  name: Blender
  version: latest
  description: Blender is a free and open-source 3D computer graphics software
    toolset used for creating animated films, visual effects, art, 3D printed
    models, motion graphics, interactive 3D applications, virtual reality, and
    computer games. This image does not support GPU rendering out of the box
    only accelerated workspace experience
data_stored:
  - type: user_content
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
  - type: configuration
    location: local_filesystem
    encryption: none
    retention: until_uninstall
    user_deletable: true
network_egress:
  telemetry: false
  update_checks: true
  external_api_calls: []
  urls:
    - github.com
    - docker.io
authentication:
  local_accounts: false
  sso: false
  mfa: false
  session_type: token
hardening:
  container_user: app
  read_only_fs: false
  network_policy: bridge
  exposed_ports:
    - "3000"
    - "3001"
compliance:
  gdpr_compatible: true
  data_sovereignty: local
  backup_strategy: manual
  audit_logging: false
  encryption_options:
    - tls
