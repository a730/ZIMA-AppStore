name: open-terminal
services:
  open-terminal:
    container_name: open-terminal
    image: ghcr.io/open-webui/open-terminal
    ports:
      - "4000:8080"
    labels:
      - "casaos.port=4000"
      - "casaos.protocol=http"
      - "casaos.entrypoint=/"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - /DATA/AppData/open-terminal/config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    x-casaos:
      volumes:
        - container: /config
          description:
            en_us: Open Terminal configuration and session data
x-casaos:
  architectures:
    - amd64
    - arm64
  main: open-terminal
  description:
    en_us: Open Terminal provides a secure and accessible terminal via web interface.
  tagline:
    en_us: Secure web-based terminal
  developer: open-webui
  author: Zima
  icon: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/open-terminal/logo.png
  thumbnail: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/open-terminal/logo.png
  title:
    en_us: Open Terminal
  category: Utilities
  port_map: "4000"
  scheme: http
  index: /
  screenshots:
    - https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/open-terminal/screenshot-1.png
