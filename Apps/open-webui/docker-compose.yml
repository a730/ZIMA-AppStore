name: open-webui
services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:latest
    ports:
      - "3009:8080"
    labels:
      - "casaos.port=3009"
      - "casaos.protocol=http"
      - "casaos.entrypoint=/"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - /DATA/AppData/open-webui/data:/app/backend/data
    restart: unless-stopped
    x-casaos:
      volumes:
        - container: /app/backend/data
          description:
            en_us: Open WebUI data (chat history, configs, uploads)
x-casaos:
  architectures:
    - amd64
    - arm64
  main: open-webui
  description:
    en_us: Open WebUI is an extensible, community-driven web interface for LLMs.
  tagline:
    en_us: Interface for your local LLMs
  developer: open-webui
  author: Zima
  icon: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/open-webui/logo.png
  thumbnail: https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/open-webui/logo.png
  title:
    en_us: Open WebUI
  category: Generative AI
  port_map: "3009"
  scheme: http
  index: /
  screenshots:
    - https://raw.githubusercontent.com/a730/ZIMA-AppStore/main/Apps/open-webui/screenshot-1.png
