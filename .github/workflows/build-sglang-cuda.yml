name: Build and Push SGLang CUDA Image

on:
  push:
    paths:
      - 'Apps/sglang-cuda/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Apps/sglang-cuda
          file: Apps/sglang-cuda/Dockerfile
          push: true
          tags: |
            ghcr.io/a730/sglang-cuda:latest
            ghcr.io/a730/sglang-cuda:v0.5.11-cu129
