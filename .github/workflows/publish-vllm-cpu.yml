name: Build and Publish vLLM CPU (AVX2 + OpenVINO)

on:
  push:
    branches: [main]
    paths:
      - 'Apps/vllm/Dockerfile'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push vLLM CPU
        uses: docker/build-push-action@v5
        with:
          context: Apps/vllm
          push: true
          tags: ghcr.io/a730/vllm-cpu:latest
          build-args: |
            VLLM_VERSION=v0.8.4
            MAX_JOBS=16
