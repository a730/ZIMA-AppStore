name: Build and Publish vLLM CPU (AVX2 + OpenVINO)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'  # weekly rebuild to pick up upstream changes

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push vLLM CPU
        uses: docker/build-push-action@v5
        with:
          context: Apps/vllm
          push: true
          tags: |
            ghcr.io/a730/vllm-cpu:latest
            ${{ github.ref_type == 'tag' && format('ghcr.io/a730/vllm-cpu:{0}', github.ref_name) || '' }}
