name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Apps/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate YAML syntax
        run: |
          for f in Apps/*/docker-compose.yml; do
            echo "Validating $f..."
            python3 -c "import yaml; yaml.safe_load(open('$f')); print('  OK')"
          done

      - name: Run tests
        run: npm test