name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Apps/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate YAML syntax
        run: |
          for f in Apps/*/docker-compose.yml; do
            echo "Validating $f..."
            node -e "
              const yaml = require('yaml');
              const fs = require('fs');
              yaml.parse(fs.readFileSync('$f', 'utf8'));
              console.log('  OK');
            "
          done

      - name: Run app validation tests
        run: npm test

      - name: Run security hardening tests
        run: npx jest Apps/__tests__/security.test.js --verbose

  security-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [
          'comfyui', 'blender', 'open-webui', 'vllm', 'paperless-ngx',
          'bookstack', 'qdrant', 'swarmclaw', 'mission-control', 'paperclip'
        ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Extract images from compose
        id: images
        run: |
          cd Apps/${{ matrix.app }}
          IMAGES=$(node -e "
            const yaml = require('yaml');
            const fs = require('fs');
            try {
              const data = yaml.parse(fs.readFileSync('docker-compose.yml', 'utf8'));
              const images = Object.values(data.services || {})
                .map(s => s.image)
                .filter(Boolean);
              console.log(images.join(','));
            } catch(e) { console.log(''); }
          ")
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "Found images: $IMAGES"

      - name: Install Trivy
        if: steps.images.outputs.images != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget apt-transport-https gnupg
          mkdir -p /etc/apt/keyrings
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /etc/apt/keyrings/trivy.gpg > /dev/null
          . /etc/os-release && echo "deb [signed-by=/etc/apt/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $VERSION_CODENAME main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy

      - name: Scan images for CVEs
        if: steps.images.outputs.images != ''
        continue-on-error: true
        run: |
          IFS=',' read -ra IMG_LIST <<< "${{ steps.images.outputs.images }}"
          for img in "${IMG_LIST[@]}"; do
            echo "=== Scanning $img ==="
            trivy image --severity CRITICAL,HIGH --exit-code 1 --no-progress "$img" 2>&1 || true
          done

  compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check compliance metadata
        run: |
          MISSING_COM=false
          MISSING_SEC=false
          for dir in Apps/*/; do
            app=$(basename "$dir")
            [ "$app" = "__tests__" ] && continue
            [ ! -f "${dir}compliance.yaml" ] && echo "MISSING: $app/compliance.yaml" && MISSING_COM=true
            [ ! -f "${dir}SECURITY.md" ] && echo "MISSING: $app/SECURITY.md" && MISSING_SEC=true
          done
          if [ "$MISSING_COM" = "true" ] || [ "$MISSING_SEC" = "true" ]; then
            echo "::warning::Some apps missing compliance metadata or security docs"
          fi