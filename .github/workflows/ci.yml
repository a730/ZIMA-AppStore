name: CI

on:
  push:
    branches: [main]
    paths:
      - 'Apps/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Apps/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate YAML syntax
        run: |
          for f in Apps/*/docker-compose.yml; do
            echo "Validating $f..."
            node -e "
              const yaml = require('yaml');
              const fs = require('fs');
              yaml.parse(fs.readFileSync('$f', 'utf8'));
              console.log('  OK');
            "
          done

      - name: Run app validation tests
        run: npm test

      - name: Run security hardening tests
        run: npx jest tests/security.test.js --verbose

  scan-matrix:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.discover.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover all app directories
        id: discover
        run: |
          APPS=$(node -e "
            const fs = require('fs');
            const apps = fs.readdirSync('Apps')
              .filter(f => fs.statSync('Apps/' + f).isDirectory());
            console.log(JSON.stringify(apps));
          ")
          echo "apps=$APPS" >> $GITHUB_OUTPUT

  security-scan:
    needs: scan-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.scan-matrix.outputs.apps) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Extract images from compose
        id: images
        run: |
          cd Apps/${{ matrix.app }}
          IMAGES=$(node -e "
            const yaml = require('yaml');
            const fs = require('fs');
            try {
              const data = yaml.parse(fs.readFileSync('docker-compose.yml', 'utf8'));
              const images = Object.values(data.services || {})
                .map(s => s.image)
                .filter(Boolean);
              console.log(images.join(','));
            } catch(e) { console.log(''); }
          ")
          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "Found images: $IMAGES"

      - name: Install Trivy
        if: steps.images.outputs.images != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget apt-transport-https gnupg
          mkdir -p /etc/apt/keyrings
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /etc/apt/keyrings/trivy.gpg > /dev/null
          . /etc/os-release && echo "deb [signed-by=/etc/apt/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $VERSION_CODENAME main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy

      - name: Scan images for CVEs
        if: steps.images.outputs.images != ''
        continue-on-error: true
        run: |
          IFS=',' read -ra IMG_LIST <<< "${{ steps.images.outputs.images }}"
          for img in "${IMG_LIST[@]}"; do
            echo "=== Scanning $img ==="
            trivy image --severity CRITICAL,HIGH --no-progress --timeout 15m "$img" 2>&1 || echo "::warning::Trivy scan failed for $img (image may be private or unavailable)"
          done

      - name: Generate SBOMs
        if: steps.images.outputs.images != ''
        continue-on-error: true
        run: |
          IFS=',' read -ra IMG_LIST <<< "${{ steps.images.outputs.images }}"
          for img in "${IMG_LIST[@]}"; do
            SANITIZED=$(echo "$img" | sed 's/[^a-zA-Z0-9._-]/_/g')
            echo "=== Generating SBOM for $img ==="
            mkdir -p "sboms/${{ matrix.app }}"
            trivy image --format spdx-json --output "sboms/${{ matrix.app }}/${SANITIZED}.spdx.json" "$img" 2>&1 || echo "::warning::SBOM generation failed for $img"
          done

      - name: Upload SBOMs
        if: steps.images.outputs.images != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.app }}
          path: sboms/

  sbom-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          path: sboms-raw/

      - name: Organize SBOMs into sboms/
        run: |
          mkdir -p sboms
          for artifact_dir in sboms-raw/*/; do
            if [ -d "$artifact_dir" ]; then
              cp -r "$artifact_dir/"* sboms/
            fi
          done
          rm -rf sboms-raw
          echo "=== SBOMs collected ==="
          find sboms -name "*.spdx.json" | sort

      - name: Commit SBOMs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sboms/
          if git diff --cached --quiet; then
            echo "No SBOM changes to commit"
          else
            git commit -m "Update SBOMs for ${{ github.ref_name }}"
            git push
          fi

  compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check compliance metadata
        run: |
          MISSING=false
          for dir in Apps/*/; do
            app=$(basename "$dir")
            if [ "$app" = "__tests__" ]; then continue; fi
            if [ ! -f "${dir}compliance.yaml" ]; then echo "MISSING: $app/compliance.yaml"; MISSING=true; fi
            if [ ! -f "${dir}SECURITY.md" ]; then echo "MISSING: $app/SECURITY.md"; MISSING=true; fi
          done
          if [ "$MISSING" = "true" ]; then
            echo "::error::Some apps missing compliance metadata or security docs"
            exit 1
          fi

      - name: Check SECURITY.md has VDP cross-reference
        run: |
          MISSING=false
          for dir in Apps/*/; do
            app=$(basename "$dir")
            secfile="${dir}SECURITY.md"
            if [ -f "$secfile" ]; then
              if ! grep -q "SECURITY.md" "$secfile"; then
                echo "MISSING: $app/SECURITY.md missing VDP cross-reference"
                MISSING=true
              fi
            fi
          done
          if [ "$MISSING" = "true" ]; then
            echo "::error::Some SECURITY.md files missing VDP cross-reference to root SECURITY.md"
            exit 1
          fi