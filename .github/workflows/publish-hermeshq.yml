name: Build and Publish HermesHQ

on:
  push:
    branches: [main]
    paths:
      - 'Apps/hermeshq/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: https://github.com/jpalmae/hermeshq.git#main
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/a730/zima-appstore-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: https://github.com/jpalmae/hermeshq.git#main
          file: frontend/Dockerfile
          build-args: VITE_API_BASE_URL=
          push: true
          tags: ghcr.io/a730/zima-appstore-frontend:latest
