name: Build and Publish SwarmControl Bridge

on:
  push:
    branches: [main]
    paths:
      - 'Apps/swarm-control/bridge/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Gateway Bridge
        uses: docker/build-push-action@v5
        with:
          context: Apps/swarm-control/bridge
          push: true
          tags: ghcr.io/a730/swarm-control-bridge:latest
