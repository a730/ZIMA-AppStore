name: Build and Publish SwarmControl Bridge

on:
  push:
    branches: [main]
    paths:
      - 'Apps/swarm-control/bridge/**'
      - '.github/workflows/publish-swarm-control-bridge.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'  # weekly rebuild to pick up upstream changes

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Gateway Bridge
        uses: docker/build-push-action@v5
        with:
          context: Apps/swarm-control/bridge
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/a730/swarm-control-bridge:latest
            ghcr.io/a730/swarm-control-bridge:${{ github.sha }}
