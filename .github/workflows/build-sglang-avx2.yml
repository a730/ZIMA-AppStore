name: Build and Push SGLang AVX2 CPU Image

on:
  push:
    paths:
      - 'Apps/sglang-avx2/**'
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Apps/sglang-avx2
          file: Apps/sglang-avx2/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/a730/sglang-avx2:latest
            ghcr.io/a730/sglang-avx2:v0.5.11
          cache-from: type=gha
          cache-to: type=gha,mode=max
