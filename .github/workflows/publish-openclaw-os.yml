name: Build and Publish OpenClaw-OS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate date version
        id: date
        run: echo "version=v$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Apps/openclaw-os/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/a730/openclaw-os:latest
            ghcr.io/a730/openclaw-os:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/a730/openclaw-os:{0}', github.ref_name) || '' }}
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('ghcr.io/a730/openclaw-os:{0}', steps.date.outputs.version) || '' }}
