name: Build and Publish OpenClaw-OS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

env:
  REGISTRY: ghcr.io
  OPENCLAW_REPO: openclaw/openclaw
  PLUGIN_REPO: thesysdev/openclaw-os

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENCLAW_REPO }}
          path: openclaw

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUGIN_REPO }}
          path: openclaw-os

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject openclaw-os plugin into gateway extensions
        run: |
          mkdir -p openclaw/extensions
          cp -r openclaw-os/packages/claw-plugin openclaw/extensions/openclaw-os

      - name: Generate date version
        id: date
        run: echo "version=v$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v5
        with:
          context: openclaw
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPENCLAW_EXTENSIONS=openclaw-os
          tags: |
            ghcr.io/a730/openclaw-os:latest
            ghcr.io/a730/openclaw-os:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/a730/openclaw-os:{0}', github.ref_name) || '' }}
            ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('ghcr.io/a730/openclaw-os:{0}', steps.date.outputs.version) || '' }}
